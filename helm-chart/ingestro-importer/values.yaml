mongo:
  enabled: true

  image:
    repository: mongo
    tag: 7.0
    pullPolicy: IfNotPresent

  replicaCount: 1

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  auth:
    rootUsername: admin
    rootPassword: admin

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: ""

  service:
    type: ClusterIP
    port: 27017

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

gateway:
  enabled: true
  className: nginx
  annotations: {}
  cors:
    enable: true
    allowOrigin: "*"
    allowMethods: "GET,POST,PUT,DELETE,OPTIONS"
    allowHeaders: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    allowCredentials: "true"
  tls: []
  hosts:
    - host: importer.local # Replace with your hostname.
      paths:
        - path: /sdk/v1
          pathType: Prefix
          service:
            name: importer
            port: http
        - path: /sdk/service
          pathType: Prefix
          service:
            name: aiservice
            port: http
mappingGateway:
  enabled: true
  className: nginx
  annotations: {}
  cors:
    enable: true
    allowOrigin: "*"
    allowMethods: "GET,POST,PUT,DELETE,OPTIONS"
    allowHeaders: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    allowCredentials: "true"
  hosts:
    - host: importer.local # Replace with your hostname
      paths:
        - path: /sdk/mapping/health
          pathType: Prefix
          rewriteTarget: /health
          service:
            name: mapping
            port: http
        - path: /sdk/mapping/(v1/.*)
          pathType: ImplementationSpecific
          useRegex: true
          rewriteTarget: /$1
          service:
            name: mapping
            port: http
